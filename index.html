.app{position:relative;z-index:1;height:100dvh;max-width:1600px;margin:auto;display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;padding:16px}

.side,.ws{min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:24px}

<script>
(() => {
'use strict';

/* ==========================================================================
   ИСПРАВЛЕННЫЕ FIREBASE SECURITY RULES (ВСТАВИТЬ В FIREBASE CONSOLE):
   ==========================================================================
{
  "rules": {
    "users": {
      "\$uid": {

    "chats": {

        ".read": "auth != null && root.child('chats').child(\$chatId).child('members').child(auth.uid).exists()",
        "members": {

        },
        "messages": {
          "\$msgId": {
            ".write": "auth != null && root.child('chats').child(\$chatId).child('members').child(auth.uid).exists() && newData.child('sender').val() === auth.uid"
          }
        }
      }
    }
  }
}
   ========================================================================== */

/* ========== ТОЧНЫЙ КОНФИГ FIREBASE ========== */
const firebaseConfig = {
  apiKey: "AIzaSyCOwnNn1MdC-JB2iwgv4PuuciqPHDR8EqA",
  authDomain: "cyberpulse-b5ca4.firebaseapp.com",
  databaseURL: "https://cyberpulse-b5ca4-default-rtdb.firebaseio.com",
  projectId: "cyberpulse-b5ca4",
  storageBucket: "cyberpulse-b5ca4.firebasestorage.app",
  messagingSenderId: "640950603280",
  appId: "1:640950603280:web:1db07a551a79c5ce274495"
};

try { firebase.initializeApp(firebaseConfig); } catch(e){}
const auth = firebase.auth();
const db = firebase.database();

/* ========== ЗАЩИТА ОТ XSS ========== */
function escapeHTML(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/[&<>"']/g, function(m) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[m];
  });
}

/* ========== INDEXEDDB KEY STORE ========== */
class KeyStore {
  static dbName = 'CyberPulse_CryptoDB';
  static storeName = 'keys';

  static async open() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, 1);
      request.onupgradeneeded = () => {
        request.result.createObjectStore(this.storeName);
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  static async saveKey(id, key) {
    const idb = await this.open();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(this.storeName, 'readwrite');
      tx.objectStore(this.storeName).put(key, id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  static async getKey(id) {
    const idb = await this.open();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(this.storeName, 'readonly');
      const req = tx.objectStore(this.storeName).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
}

let myKeyPair = { publicKey: null, privateKey: null };
let currentChatUser = null;
let sharedKeys = {};

async function initOrLoadCryptoKeys(uid) {
  const privateKeyKey = `ecdh_priv_${uid}`;
  const publicKeyKey = `ecdh_pub_${uid}`;

  let storedPriv = await KeyStore.getKey(privateKeyKey);
  let storedPub = await KeyStore.getKey(publicKeyKey);

  if (storedPriv && storedPub) {
    myKeyPair.privateKey = storedPriv;
    myKeyPair.publicKey = storedPub;
  } else {
    myKeyPair = await window.crypto.subtle.generateKey(
      { name: "ECDH", namedCurve: "P-256" },
      true,
      ["deriveKey", "deriveBits"]
    );
    await KeyStore.saveKey(privateKeyKey, myKeyPair.privateKey);
    await KeyStore.saveKey(publicKeyKey, myKeyPair.publicKey);
  }

  const pubRaw = await window.crypto.subtle.exportKey("spki", myKeyPair.publicKey);
  return btoa(String.fromCharCode(...new Uint8Array(pubRaw)));
}

async function deriveSharedKey(peerPublicKeyBase64) {
  if (sharedKeys[peerPublicKeyBase64]) return sharedKeys[peerPublicKeyBase64];
  const binaryDer = Uint8Array.from(atob(peerPublicKeyBase64), c => c.charCodeAt(0));
  const importedPeerPubKey = await window.crypto.subtle.importKey(
    "spki", binaryDer, { name: "ECDH", namedCurve: "P-256" }, true, []
  );
  const sharedKey = await window.crypto.subtle.deriveKey(
    { name: "ECDH", public: importedPeerPubKey },
    myKeyPair.privateKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
  sharedKeys[peerPublicKeyBase64] = sharedKey;
  return sharedKey;
}

/* ========== СВЕРКА ОТПЕЧАТКОВ (SAFETY NUMBERS) ========== */
async function calculateFingerprint(myPubKeyBase64, peerPubKeyBase64) {
  const sortedKeys = [myPubKeyBase64, peerPubKeyBase64].sort().join(':');
  const encoder = new TextEncoder();
  const data = encoder.encode(sortedKeys);
  const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hexHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
  return `${hexHash.substring(0, 4)}-${hexHash.substring(4, 8)}`;
}

async function encryptText(text, key) {
  const iv = window.crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(text);
  const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
  return {
    ct: btoa(String.fromCharCode(...new Uint8Array(ciphertext))),
    iv: btoa(String.fromCharCode(...new Uint8Array(iv)))
  };
}

async function decryptText(ctBase64, ivBase64, key) {
  try {
    const ciphertext = Uint8Array.from(atob(ctBase64), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(ivBase64), c => c.charCodeAt(0));
    const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
    return new TextDecoder().decode(decrypted);
  } catch(e) {
    return "[ОШИБКА ДЕШИФРОВАНИЯ E2EE]";
  }
}

/* ========== ГЕНЕРАТОР ПРОЦЕДУРНЫХ АВАТАРОВ ========== */
function generateGlitchAvatar(seed='user'){
  const c = document.createElement('canvas'); c.width = 80; c.height = 80;
  const cx = c.getContext('2d');
  let hash = 0; for(let i=0; i<seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
  cx.fillStyle = '#0a0f1d'; cx.fillRect(0,0,80,80);
  for(let i=0; i<8; i++){
    cx.fillStyle = (i % 2 === 0) ? '#818cf8' : '#22d3ee';
    const x = Math.abs((hash >> i) % 60); const y = Math.abs((hash >> (i+1)) % 60);
    cx.fillRect(x, y, 20, 20);
  }
  return c.toDataURL();
}

/* ========== АВТОРИЗАЦИЯ FIREBASE ========== */
const authModal = document.getElementById('auth-modal');
document.getElementById('auth-submit-btn').onclick = async () => {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value.trim();
  const rawCallsign = document.getElementById('auth-callsign').value.trim() || 'AGENT';
  const callsign = escapeHTML(rawCallsign);
  
  if(!email || !pass) return alert('Введите Email и пароль!');

  try {
    let userCred;
    try {
      userCred = await auth.signInWithEmailAndPassword(email, pass);
    } catch(e) {
      userCred = await auth.createUserWithEmailAndPassword(email, pass);
    }

    const pubKeyBase64 = await initOrLoadCryptoKeys(userCred.user.uid);
    
    await db.ref('users/' + userCred.user.uid).set({
      uid: userCred.user.uid,
      callsign: callsign,
      pubKey: pubKeyBase64
    });

    authModal.classList.add('hidden');
   
  } catch(err) {
    alert('Ошибка авторизации: ' + escapeHTML(err.message));
  }
};

document.getElementById('logout-btn').onclick = () => {
  auth.signOut().then(() => location.reload());
};

/* ========== ОСНОВНАЯ ЛОГИКА ЧАТА ========== */
let currentUid = null;
let myPubKeyBase64 = null;
let activeListenerRef = null;

function initApp(uid, callsign, pubKey) {
  currentUid = uid;
  myPubKeyBase64 = pubKey;
  
  document.getElementById('my-callsign').textContent = callsign;
  document.getElementById('my-avatar').style.backgroundImage = `url(${generateGlitchAvatar(callsign)})`;

  db.ref('users').on('value', snapshot => {
    const usersList = document.getElementById('users-list');
    usersList.innerHTML = '';
    const data = snapshot.val() || {};
    Object.values(data).forEach(u => {
      if(u.uid === currentUid) return;
      const btn = document.createElement('button');
      btn.className = 'citem';
      const safeCallsign = escapeHTML(u.callsign);
      btn.innerHTML = `
        <div class="av" style="background-image:url(${generateGlitchAvatar(safeCallsign)})"></div>
        <div>
          <div style="font-weight:800;font-size:13px">${safeCallsign}</div>
          <div style="font:700 9px 'JetBrains Mono';color:var(--muted)">Нажмите для E2EE чата</div>
        </div>
      `;
      btn.onclick = () => openChat(u);
      usersList.appendChild(btn);
    });
  });
}

async function openChat(peerUser) {
  try {
    document.getElementById('app').classList.add('chat-open');
    currentChatUser = peerUser;
    const safeCallsign = escapeHTML(peerUser.callsign);
    
    document.getElementById('chat-title').textContent = safeCallsign;
    document.getElementById('chat-status').textContent = 'E2EE Защищенный канал активен';
    document.getElementById('chat-icon').style.backgroundImage = `url(${generateGlitchAvatar(safeCallsign)})`;
    document.getElementById('messages').innerHTML = '';

    if (!peerUser.pubKey) {
      throw new Error("У этого пользователя нет публичного ключа. Зарегистрируйте НОВЫЙ аккаунт для теста.");
    }

    const fp = await calculateFingerprint(myPubKeyBase64, peerUser.pubKey);
    const fpEl = document.getElementById('fingerprint-display');
    fpEl.textContent = `SAFETY NUMBER: ${fp}`;
    fpEl.classList.remove('hidden');

    const chatId = [currentUid, peerUser.uid].sort().join('_');
    
    await db.ref(`chats/${chatId}/members`).update({
      [currentUid]: true,
      [peerUser.uid]: true
    });

    if(activeListenerRef) activeListenerRef.off();

    const sharedKey = await deriveSharedKey(peerUser.pubKey);

    activeListenerRef = db.ref('chats/' + chatId + '/messages');
    activeListenerRef.on('child_added', async snapshot => {
      const msg = snapshot.val();
      const rawText = await decryptText(msg.ct, msg.iv, sharedKey);
      addMsgToUI(rawText, msg.sender === currentUid);
    });
  } catch (e) {
    alert("Ошибка при открытии чата:\n" + e.message);
    console.error(e);
    document.getElementById('app').classList.remove('chat-open');
  }
}

/* ========== БЕЗОПАСНЫЙ РЕНДЕРИНГ СООБЩЕНИЙ ========== */
function addMsgToUI(text, isMine) {
  const msgsBox = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (isMine ? 'mine' : '');
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (text.startsWith('data:image/')) {
    const img = document.createElement('img');
    img.src = text;
    img.style.maxWidth = '200px';
    img.style.borderRadius = '8px';
    bubble.appendChild(img);
  } else {
    const mbody = document.createElement('div');
    mbody.className = 'mbody';
    mbody.textContent = text; 
    bubble.appendChild(mbody);
  }

  div.appendChild(bubble);
  msgsBox.appendChild(div);
  msgsBox.scrollTop = msgsBox.scrollHeight;
}

/* ========== RATE LIMITING & ВАЛИДАЦИЯ ========== */
let lastSendTime = 0;
let isRateLimited = false;

document.getElementById('send-button').onclick = async () => {
  const now = Date.now();
  if (isRateLimited) {
    alert('Защита от флуда: подождите 3 секунды.');
    return;
  }

  if (now - lastSendTime < 1000) {
    isRateLimited = true;
    setTimeout(() => { isRateLimited = false; }, 3000);
    alert('Обнаружен флуд. Заблокировано на 3 сек.');
    return;
  }

  const input = document.getElementById('message-input');
  const text = input.value.trim();
  
  if(!text || !currentChatUser) return;
  
  if(text.length > 2000 && !text.startsWith('data:image/')) {
    alert('Превышен лимит длины сообщения (макс. 2000 символов).');
    return;
  }

  lastSendTime = now;

  const sharedKey = await deriveSharedKey(currentChatUser.pubKey);
  const encrypted = await encryptText(text, sharedKey);
  const chatId = [currentUid, currentChatUser.uid].sort().join('_');

  await db.ref('chats/' + chatId + '/messages').push({
    sender: currentUid,
    ct: encrypted.ct,
    iv: encrypted.iv,
    ts: Date.now()
  });

  input.value = '';
};

document.getElementById('message-input').onkeydown = e => {
  if(e.key === 'Enter') document.getElementById('send-button').click();
};

/* ========== PAINT CANVAS ========== */
const paintModal = document.getElementById('paint-modal');
const pCanvas = document.getElementById('paint-canvas');
const pCtx = pCanvas.getContext('2d');
let drawing = false;

document.getElementById('open-paint-btn').onclick = () => paintModal.classList.remove('hidden');
document.getElementById('close-paint-btn').onclick = () => paintModal.classList.add('hidden');

pCanvas.onmousedown = pCanvas.ontouchstart = () => { drawing = true; pCtx.beginPath(); };
pCanvas.onmouseup = pCanvas.ontouchend = () => drawing = false;
pCanvas.onmousemove = pCanvas.ontouchmove = (e) => {
  if(!drawing) return;
  const r = pCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  pCtx.strokeStyle = '#22d3ee'; pCtx.lineWidth = 3;
  pCtx.lineTo(clientX - r.left, clientY - r.top); pCtx.stroke();
};

document.getElementById('send-paint-btn').onclick = () => {
  const imgUrl = pCanvas.toDataURL('image/jpeg', 0.6);
  document.getElementById('message-input').value = imgUrl;
  document.getElementById('send-button').click();
  paintModal.classList.add('hidden');
};

/* ========== MATRIX CANVAS BACKGROUND ========== */
const mCanvas = document.getElementById('matrix-canvas');
const mCtx = mCanvas.getContext('2d');
mCanvas.width = window.innerWidth; mCanvas.height = window.innerHeight;
const drops = Array(Math.floor(mCanvas.width / 14)).fill(1);
setInterval(() => {
  mCtx.fillStyle = 'rgba(3, 5, 10, 0.1)';
  mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
  mCtx.fillStyle = '#22d3ee';
  mCtx.font = "14px 'JetBrains Mono'";
  drops.forEach((y, i) => {
    mCtx.fillText('01X'[Math.floor(Math.random()*3)], i*14, y*14);
    if(y*14 > mCanvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  });
}, 50);

/* ========== КНОПКА «НАЗАД» ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ ========== */
document.getElementById('back-btn').onclick = () => {
  document.getElementById('app').classList.remove('chat-open');
};

/* ========== АВТО-ВХОД ПРИ ОБНОВЛЕНИИ СТРАНИЦЫ ========== */
auth.onAuthStateChanged(async user => {
  if (user) {
    const snap = await db.ref('users/' + user.uid).once('value');
    const data = snap.val();
    if (data && data.pubKey) {
      const pubKeyBase64 = await initOrLoadCryptoKeys(user.uid);
      authModal.classList.add('hidden');
      initApp(user.uid, data.callsign, pubKeyBase64);
    }
  }
});

})();
</script>
