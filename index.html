async function getChatKey(chatId, otherUid){
  try {
    if (!otherUid || otherUid === user.uid) throw new Error('self');
    const privKey = await LocalDB.get('keys', 'priv_'+user.uid);
    const peerPubB64 = users[otherUid]?.pubKey; if(!peerPubB64) throw new Error('no pub');
    const peerPubKey = await crypto.subtle.importKey("raw", Uint8Array.from(atob(peerPubB64), c => c.charCodeAt(0)), {name:"ECDH",namedCurve:"P-256"}, true, []);

    const km = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fallback_'+chatId));
    return crypto.subtle.importKey('raw', km, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
  }

async function encryptText(text, chatId, otherUid){
  const key = await getChatKey(chatId, otherUid); const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, new TextEncoder().encode(text));
  const comb = new Uint8Array(iv.length + ct.byteLength); comb.set(iv,0); comb.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode.apply(null, comb));
}
async function decryptText(b64, chatId, otherUid){
  try {
    const key = await getChatKey(chatId, otherUid); const comb = new Uint8Array(atob(b64).split('').map(c => c.charCodeAt(0)));
    const dec = await crypto.subtle.decrypt({name:'AES-GCM',iv:comb.slice(0,12)}, key, comb.slice(12));
    return new TextDecoder().decode(dec);
  } catch(e){ return '[X]'; }
}
async function encryptFileBuffer(buf, chatId, otherUid){
  const key = await getChatKey(chatId, otherUid); const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, buf);
  const comb = new Uint8Array(iv.length + ct.byteLength); comb.set(iv,0); comb.set(new Uint8Array(ct), iv.length);
  return comb.buffer;
}

let profile={username:'', avatarUrl:''};

function initFirebase() {
  app = firebase.initializeApp(firebaseConfig); auth = firebase.auth(); db = firebase.database();
  auth.onAuthStateChanged(async u => {
    if(u) {
      user = u; $('auth-screen').classList.add('hidden');
      
      if(!(await LocalDB.get('keys', 'priv_'+u.uid))) {
        const kp = await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"}, false, ["deriveKey","deriveBits"]);
        await LocalDB.set('keys', 'priv_'+u.uid, kp.privateKey);
        const pubRaw = await crypto.subtle.exportKey("raw", kp.publicKey);
        await db.ref(`usersPublic/${u.uid}/pubKey`).set(btoa(String.fromCharCode.apply(null, new Uint8Array(pubRaw))));
      }

      const snap = await db.ref('usersPublic/'+u.uid).once('value');
      profile = snap.val() || { username: 'AGENT' };
      
      // Отображение профиля в левом меню
      $('profile-name').textContent = profile.username;
      if(profile.avatarUrl){
        $('avatar-img').src = profile.avatarUrl;
        $('avatar-img').classList.remove('hidden');
        $('avatar-letter').classList.add('hidden');
      } else {
        $('avatar-letter').textContent = profile.username.charAt(0).toUpperCase();
      }
      
      db.ref('chatMeta').on('value', s => {
        chats = Object.entries(s.val()||{}).map(([id,v])=>({id,...v}));
        if(!chats.some(c=>c.id==='global')) chats.unshift({id:'global', title:'GLOBAL_NET', type:'channel'});
        renderList();
      });
      db.ref('usersPublic').on('value', s => { users = s.val()||{}; });
      
      if(settings.pin) $('pin-screen').classList.add('show');
      
      openChat('global');
    } else {
      $('auth-screen').classList.remove('hidden');
    }
  });
}

// === ЗАГРУЗКА ФАЙЛОВ (ВОЗВРАЩЕНО) ===
async function uploadMedia(file, type) {
  toast('🔒 Загрузка (0%)...');
  try {
    const buf = await file.arrayBuffer();
    const enc = await encryptFileBuffer(buf, currentChatId, null);
    const authRes = await fetch(RENDER_URL);
    const authData = await authRes.json();
    
    const fd = new FormData(); 
    fd.append('file', new Blob([enc]));
    fd.append('api_key', authData.apiKey); 
    fd.append('timestamp', authData.timestamp); 
    fd.append('signature', authData.signature);
    
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${authData.cloudName}/auto/upload`);
    xhr.upload.onprogress = e => { if(e.lengthComputable) toast(`🔒 Загрузка (${Math.round((e.loaded * 100) / e.total)}%)...`); };
    
    xhr.onload = async () => {
      if(xhr.status === 200) {
        const res = JSON.parse(xhr.responseText);
        const msg = { id: idgen('msg'), sender: profile.username, senderId: user.uid, mediaUrl: res.secure_url, mediaType: type, time: nowTime(), createdAt: Date.now() };
        await db.ref(`chats/${currentChatId}/messages/${msg.id}`).set(msg);
        toast('Отправлено');
      } else { toast('Ошибка загрузки'); }
    };
    xhr.send(fd);
  } catch(e) { console.error(e); toast('Ошибка загрузки'); }
}

async function toggleVoice(){
  if(voiceRecorder){
    voiceRecorder.stop();
    $('audio-note-button').classList.remove('recording');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    voiceChunks = []; voiceRecorder = new MediaRecorder(stream);
    voiceRecorder.ondataavailable = e => { if(e.data.size>0) voiceChunks.push(e.data); };
    
    voiceRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(voiceChunks, {type:'audio/webm'});
      await uploadMedia(new File([blob], 'voice.webm', {type:'audio/webm'}), 'audio');
    };
    
    voiceRecorder.start(); $('audio-note-button').classList.add('recording');
    toast('🔴 Запись...');
  } catch(e) { toast('Нет доступа к микрофону'); }
}

function renderList() {
  const box = $('dynamic-list'); box.innerHTML = '';
  const savedChatId = 'dm_' + [user.uid, user.uid].sort().join('_');
  let filtered = [...chats];

  if(currentFolder === 'dm') filtered = filtered.filter(c => c.type === 'dm');
  else if(currentFolder === 'group') filtered = filtered.filter(c => c.type === 'group');
  else if(currentFolder === 'channel') filtered = filtered.filter(c => c.type === 'channel' || c.id === 'global');
  else if(currentFolder === 'unread') filtered = filtered.filter(c => (c.unreadCounts?.[user.uid] || 0) > 0);

  if(currentFolder === 'all' || currentFolder === 'dm') {
    box.innerHTML += `<button class="citem ${savedChatId===currentChatId?'sel':''}" onclick="window.openChat('${savedChatId}')">
      <span class="cav" style="background:var(--grad);color:#000">⭐</span>
      <span class="ccopy"><span class="ct"><span class="ct-name">Избранное</span></span><span class="cp"><span class="cp-text">Сохраненные заметки</span></span></span>
    </button>`;
  }

  filtered.forEach(c => {
    if(c.id === savedChatId) return;
    const title = c.title || (c.type==='dm' ? 'DM' : 'GLOBAL');
    const unread = c.unreadCounts?.[user.uid] || 0;
    const badge = unread > 0 ? `<span style="background:var(--acc2);color:#000;padding:1px 6px;border-radius:10px;font:800 10px 'JetBrains Mono'">${unread}</span>` : '';
    
    box.innerHTML += `<button class="citem ${c.id===currentChatId?'sel':''}" onclick="window.openChat('${c.id}')">
      <span class="cav">#</span>
      <span class="ccopy">
        <span class="ct"><span class="ct-name">${safe(title)}</span></span>
        <span class="cp"><span class="cp-text">${safe(c.preview||'Нет сообщений')}</span>${badge}</span>
      </span>
    </button>`;
  });
}

window.openChat = function(id) {
  currentChatId = id; $('app').classList.add('chat-open');
  $('chat-title').textContent = chats.find(c=>c.id===id)?.title || (id.includes('dm_') && id.split('_')[1] === id.split('_')[2] ? 'Избранное' : 'GLOBAL_NET');
  messages = []; $('messages').innerHTML = '';
  
  const disp = chats.find(c=>c.id===id);
  let otherUid = disp?.members ? Object.keys(disp.members).find(u=>u!==user.uid) : null;
  if(!otherUid && id.includes('dm_')) otherUid = id.split('_')[2];

  db.ref(`chats/${id}/messages`).limitToLast(50).on('child_added', async snap => {
    const val = snap.val();
    if(!messages.some(m=>m.id===val.id)) {
      if(val.isEncrypted) val.text = await decryptText(val.text, id, otherUid);
      messages.push(val); messages.sort((a,b)=>a.createdAt-b.createdAt); renderChat();
    }
  });
};

async function sendMessage(){
  const input = $('message-input'); const txt = input.value.trim(); if(!txt) return;
  input.value = ''; $('ai-chips').classList.remove('show');
  
  const disp = chats.find(c=>c.id===currentChatId);
  let otherUid = disp?.members ? Object.keys(disp.members).find(u=>u!==user.uid) : null;
  if(!otherUid && currentChatId.includes('dm_')) otherUid = currentChatId.split('_')[2];
  
  const msgId = idgen('msg');
  const encText = await encryptText(txt, currentChatId, otherUid);
  
  const msgData = { id: msgId, sender: profile.username, senderId: user.uid, text: encText, isEncrypted: true, time: nowTime(), createdAt: Date.now(), readBy: { [user.uid]: true } };
  messages.push({ ...msgData, text: txt }); renderChat();
  
  await db.ref(`chats/${currentChatId}/messages/${msgId}`).set(msgData);
  await db.ref(`chatMeta/${currentChatId}`).update({ preview: txt.slice(0,60), lastMessageAt: msgData.createdAt });
}

function renderChat() {
  const box = $('messages'); const isBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;
  box.innerHTML = '';
  
  for(const m of messages) {
    const mine = m.senderId === user.uid;
    const isRead = Object.keys(m.readBy||{}).length > 1;
    let status = '';
    if(mine) status = `<span class="status ${isRead?'read':''}">${isRead?'✓✓':'✓'}</span>`;

    let content = `<div class="mbody">${safe(m.text)}</div>`;
    if(m.mediaType === 'audio') content = `<audio controls src="${m.mediaUrl}"></audio>`;
    if(m.mediaType === 'image') content = `<img class="mimg" src="${m.mediaUrl}">`;
    if(m.geo) content = `<div class="map-container" id="map_${m.id}" data-lat="${m.geo.lat}" data-lng="${m.geo.lng}"></div>`;

    box.innerHTML += `<article class="msg ${mine?'mine':''}" data-id="${m.id}">
      <div class="bubble">${content}<div class="mmeta"><span>${m.time}</span>${status}</div></div>
    </article>`;
  }
  
  if(isBottom) box.scrollTop = box.scrollHeight;
  
  messages.filter(m=>m.geo).forEach(m=>{
    const el = document.getElementById(`map_${m.id}`);
    if(el && !el._leaflet_id) {
      const map = L.map(el, { zoomControl: false }).setView([m.geo.lat, m.geo.lng], 15);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
      L.circleMarker([m.geo.lat, m.geo.lng], { color: '#22d3ee', radius: 8 }).addTo(map);
    }
  });
  
  box.querySelectorAll('.msg').forEach(el => {
    el.oncontextmenu = (e) => { e.preventDefault(); openCtx(e, el.dataset.id); };
    let pressTimer;
    el.ontouchstart = (e) => { pressTimer = setTimeout(() => { const t = e.touches[0]; openCtx(t, el.dataset.id); }, 500); };
    el.ontouchend = () => clearTimeout(pressTimer);
  });
}

function openCtx(e, id) {
  ctxMsgId = id;
  const menu = $('ctx-menu');
  menu.innerHTML = `
    <button class="ctx-btn" onclick="window.ctxAction('copy')">📋 Копировать</button>
    <button class="ctx-btn" onclick="window.ctxAction('bookmark')">🔖 В закладки</button>
    <button class="ctx-btn danger" onclick="window.ctxAction('delete')">🗑 Удалить</button>
  `;
  menu.classList.add('show');
  menu.style.left = Math.min(e.clientX || e.pageX, window.innerWidth - 200) + 'px';
  menu.style.top = Math.min(e.clientY || e.pageY, window.innerHeight - 150) + 'px';
}

window.ctxAction = async (act) => {
  $('ctx-menu').classList.remove('show');
  const msg = messages.find(m=>m.id === ctxMsgId); if(!msg) return;
  
  if(act === 'copy') { navigator.clipboard.writeText(msg.text); toast('Скопировано'); }
  if(act === 'bookmark') { await LocalDB.set('bookmarks', msg.id, msg); toast('Добавлено в закладки'); }
  if(act === 'delete') { await db.ref(`chats/${currentChatId}/messages/${ctxMsgId}`).remove(); toast('Удалено'); }
};

$('ai-reply-btn').onclick = async () => {
  if(!settings.geminiKey) return toast('Укажите Gemini Key в настройках ⚙');
  if(messages.length === 0) return;
  toast('✨ AI думает...');
  const lastMsgs = messages.slice(-3).map(m=>m.text).join('\n');
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${settings.geminiKey}`, {
      method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: `Предложи 3 коротких варианта ответа на сообщение:\n${lastMsgs}\nВыведи только 3 варианта через |` }] }] })
    });
    const data = await res.json();
    const text = data.candidates[0].content.parts[0].text;
    const options = text.split('|').map(s=>s.trim()).filter(s=>s).slice(0,3);
    const chips = $('ai-chips'); chips.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('div'); btn.className = 'ai-chip'; btn.textContent = opt;
      btn.onclick = () => { $('message-input').value = opt; sendMessage(); };
      chips.appendChild(btn);
    });
    chips.classList.add('show');
  } catch(e) { toast('AI ошибка'); }
};
