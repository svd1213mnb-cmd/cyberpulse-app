<title>CYBER_PULSE v27.2 · Production</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');
html[data-theme="cyan"]{--bg:#03050a;--panel:rgba(12,16,28,.65);--panel2:rgba(18,24,42,.85);--line:rgba(124,108,255,.18);--line2:rgba(34,211,238,.45);--text:#f8fafc;--muted:#818cf8;--muted2:#334155;--acc1:#818cf8;--acc2:#22d3ee;--grad:linear-gradient(135deg,#818cf8,#22d3ee,#38bdf8);--danger:#ff4d6d;--ok:#10b981;--warn:#fbbf24;}

html[data-theme="yellow"]{--bg:#080602;--panel:rgba(26,19,7,.65);--panel2:rgba(38,28,10,.85);--line:rgba(251,191,36,.18);--line2:rgba(251,191,36,.45);--text:#fffbeb;--muted:#fbbf24;--muted2:#3f2e08;--acc1:#f59e0b;--acc2:#fbbf24;--grad:linear-gradient(135deg,#f59e0b,#fbbf24,#fbe063);--danger:#ef4444;--ok:#10b981;--warn:#fbbf24;}
html[data-theme="orange"]{--bg:#080303;--panel:rgba(28,10,10,.65);--panel2:rgba(42,15,15,.85);--line:rgba(251,113,133,.18);--line2:rgba(251,113,133,.45);--text:#fff1f2;--muted:#fb7185;--muted2:#42131a;--acc1:#f43f5e;--acc2:#fb7185;--grad:linear-gradient(135deg,#f43f5e,#fb7185,#fda4af);--danger:#ff4d6d;--ok:#10b981;--warn:#fbbf24;}
html[data-theme="light"]{--bg:#f1f5f9;--panel:rgba(255,255,255,.75);--panel2:rgba(255,255,255,.92);--line:rgba(0,0,0,.08);--line2:rgba(99,102,241,.35);--text:#0f172a;--muted:#6366f1;--muted2:#cbd5e1;--acc1:#6366f1;--acc2:#0ea5e9;--grad:linear-gradient(135deg,#6366f1,#0ea5e9);--danger:#ef4444;--ok:#10b981;--warn:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px 'Inter',system-ui,sans-serif;user-select:none;-webkit-user-select:none;}
body{background-image:radial-gradient(circle at 15% 15%,rgba(129,140,248,0.12),transparent 45%),radial-gradient(circle at 85% 85%,rgba(34,211,238,0.12),transparent 45%);}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--muted2) transparent}::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:8px}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 15px rgba(34,211,238,.3)}50%{box-shadow:0 0 25px rgba(129,140,248,.6)}}
@keyframes skeletonPulse{0%{opacity:0.4}50%{opacity:0.8}100%{opacity:0.4}}
.app{position:relative;z-index:1;height:100dvh;max-width:1650px;margin:auto;display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px;padding:16px}
@media(min-width:1200px){.app{grid-template-columns:360px minmax(0,1fr) 340px;}}
.side,.ws,.profile-panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,0.6)}
.profile-panel{display:none;}
@media(min-width:1200px){.profile-panel{display:flex;}}
.brand{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;gap:8px}
.brand-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#03050a;font:900 18px 'JetBrains Mono',monospace;flex:none;box-shadow:0 8px 25px rgba(129,140,248,.4);animation:pulseGlow 4s infinite ease-in-out}
.brand-n{font:900 15px 'JetBrains Mono',monospace;letter-spacing:1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-s{font:700 8.5px 'JetBrains Mono',monospace;letter-spacing:1.2px;color:var(--muted);margin-top:2px;opacity:.9}
.me{display:flex;align-items:center;gap:12px;margin:0 14px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:all .25s ease}
.me:hover{border-color:var(--line2);transform:translateY(-1px)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 15px 'JetBrains Mono',monospace;color:#03050a;flex:none;overflow:hidden;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.av img{width:100%;height:100%;object-fit:cover}
.me-name{font-size:14px;font-weight:800;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-presence{font:700 10px 'JetBrains Mono',monospace;color:var(--ok);margin-top:2px;display:flex;align-items:center;gap:6px}
.me-presence i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.stories-bar{display:flex;gap:10px;padding:12px 14px 10px;overflow-x:auto;scrollbar-width:none}
.stories-bar::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;cursor:pointer;width:52px}
.story-ring{width:48px;height:48px;border-radius:50%;padding:2px;background:var(--line2);display:grid;place-items:center;transition:transform .2s ease}
.story-ring:hover{transform:scale(1.08)}
.story-ring.unread{background:var(--grad);box-shadow:0 0 14px rgba(129,140,248,.5)}
.story-ring.add-btn{background:var(--panel2);border:2px dashed var(--acc2)}
.story-avatar{width:100%;height:100%;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font:800 13px 'JetBrains Mono';overflow:hidden}
.story-avatar img{width:100%;height:100%;object-fit:cover}
.story-label{font-size:10px;font-weight:600;color:var(--muted);width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-viewer{position:fixed;inset:0;z-index:2500;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
.story-viewer.show{display:flex}
.story-progress{position:absolute;top:20px;left:16px;right:16px;display:flex;gap:6px;z-index:2502}
.story-bar-inner{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story-bar-fill{height:100%;background:#fff;width:0%;transition:width .1s linear}
.story-header{position:absolute;top:34px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;z-index:2502;color:#fff}
.story-user{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.story-content{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.story-content img,.story-content video{max-width:100%;max-height:100%;object-fit:contain}
.story-content .story-text-card{padding:40px;background:var(--grad);border-radius:28px;color:#03050a;font:800 22px 'Inter',sans-serif;text-align:center;max-width:85vw;box-shadow:0 25px 60px rgba(0,0,0,.6)}
.search{padding:6px 14px 4px;position:relative}
.search input{width:100%;background:rgba(12,16,28,.5);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 38px;font:500 13px 'Inter',sans-serif;color:var(--text);user-select:text;-webkit-user-select:text;transition:all .25s ease}
body[data-theme="light"] .search input{background:#fff}
.search input:focus{border-color:var(--acc2);background:var(--panel2);box-shadow:0 0 15px rgba(34,211,238,.15)}
.search:before{content:'⌕';position:absolute;left:24px;top:15px;color:var(--muted);font-size:16px;z-index:1}
.folders-bar{display:flex;gap:6px;padding:6px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.folders-bar::-webkit-scrollbar{display:none}
.folder-chip{padding:5px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font:700 11px 'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap;transition:all .2s ease}
.folder-chip.active{background:var(--grad);color:#03050a;border-color:transparent;box-shadow:0 4px 12px rgba(129,140,248,.3)}
.shead{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 8px;font:800 10px 'JetBrains Mono',monospace;letter-spacing:1.2px;color:var(--muted)}
.sbtn{padding:6px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--acc2);font:800 11px 'JetBrains Mono',monospace;display:flex;align-items:center;gap:4px;transition:all .2s ease}
.sbtn:hover{border-color:var(--line2);transform:scale(1.03)}
.clist{flex:1;overflow-y:auto;padding:0 10px 10px}
.citem-wrapper{position:relative;overflow:hidden;border-radius:14px;margin-bottom:4px}
.citem{position:relative;z-index:2;width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:transparent;border:1px solid transparent;border-radius:14px;color:var(--text);cursor:pointer;transition:all .2s ease}
.citem:hover,.citem.sel{background:var(--panel2);border-color:var(--line)}
.citem.sel{border-color:var(--acc2);background:var(--panel2);box-shadow:0 4px 20px rgba(34,211,238,.15)}
.cav{width:42px;height:42px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:800 15px 'JetBrains Mono',monospace;color:var(--acc2);flex:none;overflow:hidden;position:relative}
.cav img{width:100%;height:100%;object-fit:cover}
.ccopy{flex:1;min-width:0}
.ct{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
.ct-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:3px}
.cp-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:8px}
.ctime{font:700 9.5px 'JetBrains Mono',monospace;color:var(--muted2);flex:none}
.badge{background:var(--acc2);color:#03050a;font:800 10px 'JetBrains Mono';padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;display:inline-block}
.avatar-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--panel);box-shadow:0 0 8px var(--ok)}
.pin-icon{font-size:11px;color:var(--acc1);margin-right:4px}
.conn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font:700 9.5px 'JetBrains Mono',monospace;color:var(--muted);min-height:38px}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.conn.online .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chead{min-height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.cinfo{min-width:0;flex:1;cursor:pointer}
.ctitle{font:800 15px 'JetBrains Mono',monospace;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font:700 10.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:2px}
.cacts{display:flex;gap:6px;align-items:center}
.ibtn{width:36px;height:36px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;font-size:15px;flex:none;transition:all .2s ease}
.ibtn:hover{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.08);transform:scale(1.04)}
.ibtn.recording{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulseGlow 1s infinite}
.back{display:none}
.msg-search{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.msg-search input{flex:1;background:rgba(12,16,28,.6);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font:500 13px 'Inter',sans-serif;color:var(--text);user-select:text;-webkit-user-select:text}
body[data-theme="light"] .msg-search input{background:#fff}
.msg-search.hidden{display:none}
.search-nav-info{font:700 11px 'JetBrains Mono';color:var(--muted);white-space:nowrap;margin-right:4px}
.pinned-banner{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer;transition:background .2s}
.pinned-banner:hover{background:var(--panel)}
.pinned-banner-icon{color:var(--acc1);font-size:14px;flex:none}
.pinned-banner-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.msgs{flex:1;overflow-y:auto;padding:20px clamp(12px,3vw,36px) 16px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 50% 0%,rgba(129,140,248,.05) 0%,transparent 70%)}
.daytag{align-self:center;text-align:center;font:800 9.5px 'JetBrains Mono',monospace;letter-spacing:1.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:5px 14px;margin:12px 0 8px;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.sysmsg{align-self:center;text-align:center;font:700 10.5px 'JetBrains Mono',monospace;color:var(--muted);padding:5px 14px;margin:6px 0;opacity:.85}
.msg{display:flex;gap:8px;max-width:min(82%,620px);margin-top:3px;animation:pop .25s cubic-bezier(0.16,1,0.3,1);position:relative}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.multi-select-mode{cursor:pointer}
.msg-checkbox{display:none;width:18px;height:18px;border-radius:4px;border:2px solid var(--muted);align-self:center;margin-right:6px;position:relative;flex:none}
.msg.multi-select-mode .msg-checkbox{display:grid;place-items:center}
.msg.selected .msg-checkbox{background:var(--acc2);border-color:var(--acc2)}
.msg.selected .msg-checkbox::after{content:'✓';font-size:11px;color:#03050a;font-weight:900}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:4px;padding:10px 14px 8px;overflow-wrap:anywhere;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.2);user-select:none;-webkit-user-select:none;min-width:90px;font-size:var(--msg-font-size, 14px)}
.mine .bubble{background:linear-gradient(135deg,rgba(129,140,248,.25),rgba(34,211,238,.18));border-color:rgba(129,140,248,.4);border-radius:18px;border-bottom-right-radius:4px;box-shadow:0 6px 25px rgba(129,140,248,.15)}
.msg.highlight .bubble{outline:2px solid var(--acc2);outline-offset:2px}
.msg.sticker .bubble{background:none!important;border:0!important;padding:0!important;box-shadow:none!important}
.msg.sticker .mbody{font-size:64px;line-height:1}
.reply-quote{border-left:3px solid var(--acc2);padding:5px 10px;margin-bottom:6px;border-radius:0 8px 8px 0;background:rgba(0,0,0,.2);font-size:11.5px;cursor:pointer;opacity:.95}
.reply-quote b{color:var(--acc1);display:block;margin-bottom:2px}
.forwarded-from{border-left:3px solid var(--acc1);padding:4px 8px;margin-bottom:6px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.15);border-radius:0 6px 6px 0}
.forwarded-from b{color:var(--acc1)}
.mbody{white-space:pre-wrap;line-height:1.5;user-select:text;-webkit-user-select:text}
.mmeta{display:flex;gap:5px;align-items:center;justify-content:flex-end;margin-top:4px;font:700 9px 'JetBrains Mono';color:var(--muted);opacity:.85}
.mmeta .status{font-size:10.5px;color:var(--acc2)}
.mimg{display:block;max-width:min(320px,70vw);max-height:300px;object-fit:cover;border-radius:14px;margin-top:6px;cursor:zoom-in;border:1px solid var(--line)}
.videonote{width:200px;height:200px;border-radius:50%;object-fit:cover;margin-top:6px;border:3px solid var(--acc2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.file-card{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:6px;background:rgba(0,0,0,.25);border-radius:14px;border:1px solid var(--line);cursor:pointer;text-decoration:none;color:var(--text);transition:border-color .2s ease}
.file-card:hover{border-color:var(--line2)}
.file-icon{width:38px;height:38px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:17px;color:#03050a;flex:none}
.file-meta{flex:1;min-width:0;font-size:12.5px}
.file-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{font-size:10px;color:var(--muted);margin-top:2px}
.voice-bubble{display:flex;align-items:center;gap:8px;padding:4px 0}
.voice-bubble audio{max-width:min(240px,65vw);height:34px}
.media-placeholder{padding:14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px dashed var(--line2);margin-top:6px;font:700 11px 'JetBrains Mono';color:var(--muted);text-align:center}
.edited{font-size:9px;opacity:.7;margin-left:4px;font-style:italic}
.msg.deleted .mbody{opacity:.5;font-style:italic;color:var(--muted)}
.reactions{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.reactions span{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:11.5px;cursor:pointer;user-select:none;transition:all .15s ease}
.reactions span:hover{border-color:var(--line2);transform:scale(1.08)}
.reactions span.mine{border-color:var(--acc2);background:rgba(34,211,238,.18)}
.poll-card{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px;min-width:220px}
.poll-question{font-weight:800;font-size:13.5px;margin-bottom:8px;color:var(--text)}
.poll-option{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:5px;cursor:pointer;font-size:12.5px;transition:border-color .2s}
.poll-option:hover{border-color:var(--acc2)}
.poll-option.voted{border-color:var(--acc2);background:rgba(34,211,238,.1)}
.poll-bar{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.load-older{align-self:center;margin:8px 0;padding:7px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);color:var(--acc2);font:800 10.5px 'JetBrains Mono';cursor:pointer;transition:border-color .2s ease}
.load-older:hover{border-color:var(--acc1)}
.ctx-menu{position:fixed;z-index:3000;background:var(--panel2);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--line2);border-radius:18px;padding:6px;box-shadow:0 20px 60px rgba(0,0,0,.8);display:none;flex-direction:column;min-width:200px;animation:pop .15s ease}
.ctx-menu.show{display:flex}
.ctx-emoji-row{display:flex;gap:2px;padding:4px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ctx-emoji-row button{font-size:20px;padding:4px 6px;border-radius:10px;transition:transform .15s ease}
.ctx-emoji-row button:hover{background:var(--panel);transform:scale(1.2)}
.ctx-btn{padding:9px 12px;text-align:left;font-size:13px;border-radius:10px;display:flex;align-items:center;gap:10px;color:var(--text);transition:background .15s ease}
.ctx-btn:hover{background:var(--panel)}
.ctx-btn.danger{color:var(--danger)}
.ctx-sep{height:1px;background:var(--line);margin:4px 8px}
.emoji-picker{position:absolute;bottom:76px;right:16px;width:300px;height:240px;background:var(--panel2);backdrop-filter:blur(40px);border:1px solid var(--line2);border-radius:20px;padding:10px;display:none;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.8);z-index:100;animation:pop .15s ease}
.emoji-picker.show{display:flex}
.emoji-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
